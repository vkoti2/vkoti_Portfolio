<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Guides | Project Documentation</title>
  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #1c2a39;
      --muted: #65758b;
      --primary: #1557d6;
      --primary-dark: #0d3fa5;
      --border: #dfe9f5;
      --shadow: 0 18px 45px rgba(21, 35, 58, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      padding: 0 4px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .primary-button,
    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .primary-button {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 12px 22px rgba(21, 87, 214, 0.2);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-1px);
    }

    .secondary-button {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .sidebar,
    .viewer-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 24px 18px;
    }

    .sidebar h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pdf-item {
      width: 100%;
      background: #f8fbff;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pdf-item:hover {
      border-color: rgba(21, 87, 214, 0.25);
      background: #f2f7ff;
    }

    .pdf-item.active {
      border-color: rgba(21, 87, 214, 0.4);
      background: linear-gradient(135deg, #edf4ff, #f7faff);
      box-shadow: inset 0 0 0 1px rgba(21, 87, 214, 0.08);
    }

    .pdf-item .title {
      font-weight: 600;
      line-height: 1.35;
      flex: 1;
      min-width: 0;
    }

    .pdf-item .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(21, 87, 214, 0.08);
      color: var(--primary);
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .viewer-panel {
      overflow: hidden;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #f9fbff 0%, #fff 100%);
    }

    .viewer-title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(21, 87, 214, 0.08);
      color: var(--primary);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .viewer-header h2 {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-frame {
      position: relative;
      min-height: 780px;
      background: #eef3f8;
    }

    .viewer-frame iframe {
      width: 100%;
      height: 780px;
      border: 0;
      display: block;
      background: #fff;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      color: var(--muted);
      background: linear-gradient(180deg, #f7fafe 0%, #eef3f8 100%);
    }

    .empty-state-inner {
      max-width: 420px;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      color: var(--text);
    }

    .empty-state p {
      margin: 0;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .viewer-frame,
      .viewer-frame iframe {
        min-height: 620px;
        height: 620px;
      }
    }

    @media (max-width: 640px) {
      .topbar,
      .viewer-header {
        flex-direction: column;
        align-items: stretch;
      }

      .page {
        padding: 24px 14px 40px;
      }

      .sidebar {
        padding: 20px 14px;
      }

      .viewer-header {
        padding: 14px 16px;
      }

      .viewer-header h2 {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>User Guides</h1>
      </div>
      <a id="openSelectedGuide" class="primary-button" href="#" target="_blank" rel="noopener noreferrer">Open selected guide</a>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>Available PDF Guides</h2>
        <div id="pdfList" class="pdf-list" aria-label="List of PDF guides"></div>
      </aside>

      <section class="viewer-panel" aria-label="PDF viewer section">
        <div class="viewer-header">
          <div class="viewer-title-group">
            <span class="badge">PDF Viewer</span>
            <h2 id="documentTitle">Select a guide</h2>
          </div>
          <a id="openInNewTab" class="secondary-button" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
        </div>

        <div id="viewerFrame" class="viewer-frame" aria-live="polite">
          <div class="empty-state">
            <div class="empty-state-inner">
              <div class="empty-icon">📄</div>
              <h3>Choose a PDF from the list</h3>
              <p>The selected user guide and project documentation will be displayed here.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const guides = [
      {
        title: "An experimental study to evaluate lncRNA SNHG1 gene expressionlevels in cervical cancer patiens",
        file: "An experimental study to evaluate lncRNA SNHG1 gene expressionlevels in cervical cancer patiens .pdf"
      },
      {
        title: "Evolution of Digital Payments in the new age",
        file: "Evolution of Digital Payments in the new age.pdf"
      },
      {
        title: "Greenway Health Medication User Guide",
        file: "Greenway_Health_Medication_User_Guide.pdf"
      },
      {
        title: "Health Information Exchange Concept Guide",
        file: "Health_Information_Exchange_Concept_Guide.pdf"
      },
      {
        title: "Predicting how cancer patients respond to radiotherapy",
        file: "Predicting how cancer patients respond to radiotherapy.pdf"
      }
    ];

    const pdfList = document.getElementById('pdfList');
    const viewerFrame = document.getElementById('viewerFrame');
    const documentTitle = document.getElementById('documentTitle');
    const openInNewTab = document.getElementById('openInNewTab');
    const openSelectedGuide = document.getElementById('openSelectedGuide');

    let activeIndex = 0;

    function renderGuideList() {
      pdfList.innerHTML = '';

      guides.forEach((guide, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'pdf-item' + (index === activeIndex ? ' active' : '');
        button.setAttribute('aria-label', 'Open ' + guide.title);
        button.innerHTML = `
          <span class="icon">📘</span>
          <span class="title">${guide.title}</span>
        `;
        button.addEventListener('click', () => loadGuide(index));
        pdfList.appendChild(button);
      });
    }

    function loadGuide(index) {
      activeIndex = index;
      const guide = guides[index];

      documentTitle.textContent = guide.title;
      openInNewTab.href = guide.file;
      openSelectedGuide.href = guide.file;

      viewerFrame.innerHTML = `
        <iframe
          src="${guide.file}"
          title="${guide.title}"
          allow="fullscreen"
          loading="lazy"
        ></iframe>
      `;

      renderGuideList();
    }

    renderGuideList();
    loadGuide(activeIndex);
  </script>
</body>
</html>
